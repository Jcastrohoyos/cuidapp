name: Android Build

on:
  push:
    branches: [main, feat/foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # --- Checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Node.js ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # --- Java ---
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- Android SDK (use pre-installed SDK, no action) ---
      - name: Setup Android SDK
        run: |
          # Use pre-installed SDK
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      # --- Install SDK packages ---
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      # --- Cache Gradle (manual, apuntando a mobile/) ---
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # --- Install dependencies ---
      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      # --- Prebuild ---
      - name: Expo prebuild (Android)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      # --- Build APK ---
      - name: Build Release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"

      # --- Upload Artifact ---
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # --- Optional: Lint & Typecheck ---
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: ./mobile
      - run: npx tsc --noEmit --skipLibCheck
        working-directory: ./mobile
      - run: npx eslint src --ext .ts,.tsx
        working-directory: ./mobile
      - run: npx jest --passWithNoTests
        working-directory: ./mobile